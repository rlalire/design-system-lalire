; Bloc treuil « lévitation » — firmware
; Carte : Olimex ESP32-POE (Ethernet filaire + alimentation logique par PoE)
[env:treuil]
platform = espressif32@6.9.0
board = esp32-poe
framework = arduino
monitor_speed = 115200
lib_deps =
    gin66/FastAccelStepper@1.4.0
build_flags =
    -DWINCH_ID=1        ; numéro du bloc (1 à 4) — à changer avant de flasher chaque bloc
