; Bloc treuil micro — firmware
; Carte : Olimex ESP32-POE (Ethernet). Moteur de gimbal piloté par SimpleFOC.
[env:treuil]
platform = espressif32@6.9.0
board = esp32-poe
framework = arduino
monitor_speed = 115200
lib_archive = false
lib_deps =
    askuric/Simple FOC@2.3.4
build_flags =
    -DWINCH_ID=1        ; numéro du bloc (1 à 4) — à changer avant de flasher chaque bloc
